[mgr]
ratio         = [ 1, 4, 2 ]
sort_by        = "alphabetical"
sort_sensitive = true
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
linemode       = "size_and_mtime"

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]
cache_dir = "/home/joker/.cache/yazi"
image_filter    = "triangle"

[opener]
edit = [
  { run = '$EDITOR %s', block = true },
]
open = [
  { run = 'xdg-open %s', desc = "Open" },
]
dua = [
  { run = 'dua -x i %s', block = true, interactive = true, desc = "dua" },
]
archive = [
  { run = 'mcomix %s' },
  { run = 'unar %s', desc = "Extract here" },
  { run = 'unar -encoding windows-31j %s', desc = "Extract here (SJIS)" },
]
create_archive = [
  { run = 'for d in %s; do if [ -d "$d" ]; then zip -0 -r "${d%/}.zip" "$d"; fi; done', desc = "create zip each (no compress)", block = true },
]
image = [
  { run = 'swayimg %s %d1', orphan = true, desc = "swayimg (dir)" },
  { run = 'swayimg -r %s %d1', orphan = true, desc = "swayimg (recursive)" },
  { run = 'nsxiv %s', orphan = true, desc = "nsxiv" },
]
media = [
  { run = 'mpv --profile=gui %s', orphan = true, desc = "mpv" },
  { run = 'mpv -v %s', desc = "mpv (verbose)", block = true },
  { run = 'mpv --profile=headphone %s', orphan = true, desc = "mpv (headphone)" },
  { run = 'mpv --profile=surround-hdmi %s', orphan = true, desc = "mpv (hdmi)" },
  { run = 'mpv --profile=hdr %s', orphan = true, desc = "mpv (HDR)" },
  { run = 'mpv --profile=inverse-tone-mapping %s', orphan = true, desc = "mpv (itm)" },
  { run = 'mpv --profile=surround-hdmi --profile=hdr %s', orphan = true, desc = "mpv (hdmi + HDR)" },
  { run = 'dmm-renamer %s', desc = "dmm-renamer", block = true },
  { run = 'convert_to_mp4 %s', desc = "convert_to_mp4", block = true },
]
audio = [
  { run = 'rsgain easy -p truepeak %s', desc = "rsgain", block = true },
  { run = 'kid3-qt %s', desc = "kid3", orphan = true },
  { run = 'picard %s', desc = "picard", orphan = true },
]
iso = [
  { run = 'mpv dvd:// --dvd-device=%s1', orphan = true, desc = "mpv (DVD)" },
]
markdown = [
  { run = 'inlyne %s', orphan = true, desc = "inlyne markdown viewer" },
]
set_wallpaper = [
  { run = 'awww img -o DP-1 --resize fit --transition-duration 2 --transition-type any --transition-fps 60 %s', desc = "Set as wallpaper (DP-1)" },
  { run = 'awww img -o DP-2 --resize fit --transition-duration 2 --transition-type any --transition-fps 60 %s', desc = "Set as wallpaper (DP-2)" },
  { run = 'awww img --resize fit --transition-duration 2 --transition-type any --transition-fps 60 %s', desc = "Set as wallpaper (All)" },
]

[open]
rules = [
  { mime = "text/*", use = ["edit", "markdown"] },
  { mime = "image/*", use = ["image", "set_wallpaper"] },
  { mime = "video/*", use = "media" },
  { mime = "audio/*", use = ["media", "audio"] },
  { mime = "inode/x-empty", use = "edit" },

  { mime = "application/json", use = "edit" },
  { mime = "*/javascript", use = "edit" },

  { mime = "application/zip", use = "archive" },
  { url = "*.rar", use = "archive" },

  { url = "*.iso", use = "iso" },

  { mime = "*", use = ["open", "dua", "create_archive"] },
]

[tasks]
file_workers     = 15
plugin_workers   = 10
fetch_workers    = 10
preload_workers  = 15
process_workers  = 15
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [ 8000, 8000 ]
suppress_preload = false

[plugin]
prepend_previewers = [
  { url = "*.zip", run = "comic-thumbnail" },
  { url = "*.cbz", run = "comic-thumbnail" },
  { url = "*.md", run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dracula -- "$1"' },
  { mime = "application/x-tar",           run = "ouch" },
  { mime = "application/x-bzip2",         run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-xz",            run = "ouch" },
]

[[plugin.prepend_fetchers]]
group = "mime"
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"

[[plugin.prepend_fetchers]]
group = "mime"
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"

[[plugin.prepend_fetchers]]
group = "git"
url   = "*"
run   = "git"

[[plugin.prepend_fetchers]]
group = "git"
url   = "*/"
run   = "git"
